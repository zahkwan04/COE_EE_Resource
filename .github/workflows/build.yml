name: C/C++ Build Check

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Compile Sample Code (Basics)
        run: |
          g++ -Wall -Wextra "02Sample_Code/Basics/01hello_world.c" -o hello_world_test || echo "Compilation failed"

      - name: Compile Ray Tracer
        run: |
          g++ -O3 "02Sample_Code/Graphics/04ray_tracer.cpp" -o raytracer_test || echo "Compilation failed"

      - name: Compile Deep Dive C Examples
        run: |
          echo "Skipping 05Deep_Dive_C/Core_Concepts validation due to platform-specific headers (windows.h, avr/io.h)"
